name: Lint
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run isort
        run: |
          uv run isort --check src
      - name: Run black
        run: |
          uv run black --check src
      - name: Run mypy
        env:
          PYTHONPATH: "src"
        run: |
          uv run mypy src
      - name: Run pylint
        env:
          PYTHONPATH: "src"
        run: |
          uv run pylint src
